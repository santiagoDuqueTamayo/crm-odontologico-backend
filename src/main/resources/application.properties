spring.application.name=kassar
server.port=8080

# ==========================================================
# Selector de Proveedor de IA
# Cambia 'odontograma.ai.provider' entre:
#   - nvidia-nim   (API de NVIDIA NIM)
#   - ollama       (Modelo local en Ollama)
#   - google-genai (Google AI Studio / Gemini)
# ==========================================================
odontograma.ai.max-attempts=3
odontograma.ai.provider=${ODONTOGRAMA_AI_PROVIDER:nvidia-nim}
spring.ai.model.chat=${odontograma.ai.provider}
spring.ai.model.image=none

# ==========================================================
# 1. Configuración NVIDIA NIM (provider = nvidia-nim)
# ==========================================================
odontograma.ai.nvidia.base-url=${NVIDIA_NIM_BASE_URL:https://integrate.api.nvidia.com/v1}
odontograma.ai.nvidia.chat-endpoint=/chat/completions
odontograma.ai.nvidia.api-key=${NVIDIA_NIM_API_KEY:}
odontograma.ai.nvidia.model=${NVIDIA_NIM_MODEL:mistralai/mistral-large-4-1t-a52b}
odontograma.ai.nvidia.temperature=0.0
odontograma.ai.nvidia.max-tokens=4096
odontograma.ai.nvidia.connect-timeout-seconds=15
odontograma.ai.nvidia.read-timeout-seconds=460

# ==========================================================
# 2. Configuración Ollama Local (provider = ollama)
# ==========================================================
odontograma.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
odontograma.ai.ollama.chat-endpoint=/api/chat
odontograma.ai.ollama.model=${OLLAMA_MODEL:odontograma-llama:latest}
odontograma.ai.ollama.temperature=0.1
odontograma.ai.ollama.connect-timeout-seconds=10
odontograma.ai.ollama.read-timeout-seconds=300

# ==========================================================
# 3. Configuración Google AI Studio (provider = google-genai)
# ==========================================================
spring.ai.google.genai.api-key=${GOOGLE_AI_STUDIO_API_KEY:}
spring.ai.google.genai.chat.model=${GOOGLE_AI_STUDIO_MODEL:gemini-flash-latest}
spring.ai.google.genai.chat.response-mime-type=application/json
spring.ai.google.genai.chat.temperature=0.1
