spring.application.name=kassar
server.port=8080

# ==========================================================
# Configuración del Motor de IA (Ollama) y Autocorrección
# ==========================================================
odontograma.ai.max-attempts=3
odontograma.ai.ollama.base-url=http://localhost:11434
odontograma.ai.ollama.chat-endpoint=/api/chat
odontograma.ai.ollama.model=odontograma-llama:latest
odontograma.ai.ollama.temperature=0.1
odontograma.ai.ollama.connect-timeout-seconds=10
odontograma.ai.ollama.read-timeout-seconds=60
